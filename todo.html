```html
<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<title>To-Do List</title>

<style>

body{
font-family:Arial;
background:#f5f6fa;
padding:30px;
}

.container{
max-width:900px;
margin:auto;
background:white;
padding:20px;
border-radius:8px;
box-shadow:0 0 10px rgba(0,0,0,0.1);
}

h2{
margin-bottom:20px;
}

input,select{
padding:8px;
margin-right:10px;
}

button{
padding:8px 14px;
cursor:pointer;
}

table{
width:100%;
border-collapse:collapse;
margin-top:20px;
}

th,td{
border:1px solid #ddd;
padding:8px;
text-align:center;
}

th{
background:#f1f1f1;
}

.priority-high{
color:red;
font-weight:bold;
}

.priority-medium{
color:orange;
font-weight:bold;
}

.priority-low{
color:green;
font-weight:bold;
}

</style>

</head>

<body>

<div class="container">

<h2>My To-Do Tasks</h2>

<input id="taskTitle" placeholder="Task Title">

<select id="priority">
<option value="High">High</option>
<option value="Medium">Medium</option>
<option value="Low">Low</option>
</select>

<input type="date" id="dueDate">

<button onclick="addTask()">Add Task</button>


<table>

<thead>

<tr>
<th>Task</th>
<th>Priority</th>
<th>Due Date</th>
<th>Status</th>
<th>Done</th>
<th>Delete</th>
</tr>

</thead>

<tbody id="taskTable"></tbody>

</table>

</div>


<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/12.10.0/firebase-app.js";

import {getDatabase,ref,set,get,update,remove}from "https://www.gstatic.com/firebasejs/12.10.0/firebase-database.js";

import { firebaseConfig } from "./firebase-config.js";
const app = initializeApp(firebaseConfig);
const db = getDatabase(app);

/* ADD TASK */

window.addTask = async function(){

let title=document.getElementById("taskTitle").value;

let priority=document.getElementById("priority").value;

let due=document.getElementById("dueDate").value;

if(!title){

alert("Please enter task");

return;

}

let username=localStorage.getItem("username") || "guest";

let taskId=Date.now();

await set(ref(db,"tasks/"+taskId),{

title:title,

priority:priority,

dueDate:due,

assignedTo:username,

progress:"Pending",

completed:false

});

document.getElementById("taskTitle").value="";

loadTasks();

}



/* LOAD TASKS */

window.loadTasks = async function(){

let username=localStorage.getItem("username") || "guest";

const snapshot=await get(ref(db,"tasks"));

let table=document.getElementById("taskTable");

table.innerHTML="";

if(!snapshot.exists()) return;

snapshot.forEach(child=>{

let task=child.val();

if(task.assignedTo===username){

let priorityClass="";

if(task.priority==="High") priorityClass="priority-high";

if(task.priority==="Medium") priorityClass="priority-medium";

if(task.priority==="Low") priorityClass="priority-low";

table.innerHTML+=`

<tr>

<td>${task.title}</td>

<td class="${priorityClass}">${task.priority}</td>

<td>${task.dueDate}</td>

<td>${task.progress}</td>

<td>
<input type="checkbox"
${task.completed?"checked":""}
onclick="toggleTask('${child.key}')">
</td>

<td>
<button onclick="deleteTask('${child.key}')">
Delete
</button>
</td>

</tr>

`;

}

});

}



/* TOGGLE COMPLETE */

window.toggleTask = async function(id){

const snapshot=await get(ref(db,"tasks/"+id));

let task=snapshot.val();

await update(ref(db,"tasks/"+id),{

completed:!task.completed,

progress: task.completed ? "Pending" : "Completed"

});

loadTasks();

}



/* DELETE TASK */

window.deleteTask = async function(id){

await remove(ref(db,"tasks/"+id));

loadTasks();

}



/* INITIAL LOAD */

loadTasks();


</script>

</body>
</html>
```
