document.addEventListener("mousemove", resetTimer);

function resetTimer(){
  clearTimeout(timer);
timer = setTimeout(async () => {

Swal.fire("Session Timeout", "Auto logout", "info");

"Session",
"Auto Logout (Session Timeout)"
);

// ----------- FIREBASE USER FUNCTIONS ------------

// Get users from Firebase Realtime Database
async function getUsers() {
  try {
    const dbRef = ref(db);
    const snapshot = await get(child(dbRef, "users"));
    if (snapshot.exists()) {
      return Object.values(snapshot.val());
    }
    return [];
  } catch (error) {
    console.error("Error getting users:", error);
    return [];
  }
}

// Save users array to Firebase Realtime Database
async function saveUsers(users) {
  try {
    let usersObj = {};
    users.forEach(u => {
      usersObj[u.username] = u;
    });
    await set(ref(db, "users"), usersObj);
  } catch (error) {
    console.error("Error saving users:", error);
  }
}

function updateUIAccess() {
  let loggedUser = JSON.parse(localStorage.getItem("loginUser") || "{}");
  let role = loggedUser.role || "";

  // Select all buttons in sidebar and ribbon that have data-role
  let buttons = document.querySelectorAll("[data-role]");

  buttons.forEach(btn => {
    let roles = btn.getAttribute("data-role").split(",").map(r => r.trim());
    if (roles.includes(role)) {
      btn.style.display = "inline-block"; // show
    } else {
      btn.style.display = "none"; // hide
    }
  });
}
// ----------- LOGIN / LOGOUT ------------

async function login() {

  if (!window.firebaseReady) {
    Swal.fire(
      "Error",
      "Firebase not initialized yet. Please refresh.",
      "error"
    );
    return;
  }

  let username = document
    .getElementById("loginUser")
    .value
    .trim();

  let password = document
    .getElementById("loginPass")
    .value
    .trim();

  try {

    const snapshot = await get(ref(db, "users"));

    if (!snapshot.exists()) {
      Swal.fire(
        "Error",
        "No users found in database",
        "error"
      );
      return;
    }

    let users = snapshot.val();

    let foundUser = Object.values(users).find(
      user =>
        user.username === username &&
        user.password === password
    );

    if (!foundUser) {

      Swal.fire(
        "Login Failed",
        "Invalid username or password",
        "error"
      );

      return;
    }

    if (foundUser.status !== "Active") {

      Swal.fire(
        "Access Denied",
        "User inactive",
        "error"
      );

      return;
    }

    // SAVE USER
    localStorage.setItem(
      "loginUser",
      JSON.stringify(foundUser)
    );

    document.getElementById("loginPage").style.display = "none";

    document.getElementById("dashboard").style.display = "block";

    document.getElementById("displayUser").innerHTML =
      `${foundUser.username} (${foundUser.role})`;

    resetTimer();

    updateUIAccess();

    listenNotifications();

    home();

    Swal.fire(
      "Success",
      "Login successful",
      "success"
    );

  } catch (error) {

    console.error(error);

    Swal.fire(
      "Error",
      error.message,
      "error"
    );
  }
}

  
  
async function logout() {

  localStorage.removeItem("loginUser");

  document.getElementById("loginPage").style.display = "block";

  document.getElementById("dashboard").style.display = "none";

  document.getElementById("loginUser").value = "";

  document.getElementById("loginPass").value = "";

  Swal.fire(
    "Logged Out",
    "Session ended",
    "success"
  );
}

// ----------- PASSWORD CHANGE ------------

async function changePassword() {
  let loggedUser = JSON.parse(localStorage.getItem("loginUser") || "{}");
  if (!loggedUser.username) return;

  const { value: newPassword } = await Swal.fire({
    title: "Change Password",
    input: "password",
    inputLabel: "New Password",
    inputPlaceholder: "Enter new password",
    showCancelButton: true
  });

  if (newPassword) {
    let users = await getUsers();
    let user = users.find(u => u.username === loggedUser.username);
    if (user) {
      user.password = newPassword;
      user.pwdDate = new Date().toISOString();
      await saveUsers(users);
      localStorage.setItem("loginUser", JSON.stringify(user));
      Swal.fire("Success", "Password changed successfully", "success");
    }
  }
}

async function createUser() {
  let user = getLoggedUser();
if(user.role !== "Admin"){
Swal.fire("Access Denied","Admin only feature","error");
return;
}
  let username = document.getElementById("newUsername").value.trim();
  let userID = document.getElementById("newUserID").value.trim();
  let dept = document.getElementById("newDepartment").value.trim();
  let password = document.getElementById("newPassword").value.trim();
  let role = document.getElementById("newRole").value;
  let status = document.getElementById("newStatus").value;

  if (!username || !userID || !dept || !password)
    return Swal.fire("Error", "All fields are required", "error");

  let users = await getUsers();

  if (users.find(u => u.username === username || u.userID === userID))
    return Swal.fire("Error", "Username or User ID already exists", "error");

  users.push({ username, userID, department: dept, password, role, status, pwdDate: new Date().toISOString() });

  await saveUsers(users);
  Swal.fire("Success", "User created successfully", "success");
  await writeAuditLog("User Management","Create User ("+username+")");
  createUserPage();
}

async function editUser(username) {
  let users = await getUsers();
  let user = users.find(u => u.username === username);
  if (!user) return;
  const { value } = await Swal.fire({
    title: `Edit User: ${username}`,
    html: `<input id="editDepartment" value="${user.department}" class="swal2-input">
      <select id="editRole" class="swal2-input"><option value="Admin" ${user.role === 'Admin' ? 'selected' : ''}>Admin</option><option value="User" ${user.role === 'User' ? 'selected' : ''}>User</option></select>
      <select id="editStatus" class="swal2-input"><option value="Active" ${user.status === 'Active' ? 'selected' : ''}>Active</option><option value="Inactive" ${user.status === 'Inactive' ? 'selected' : ''}>Inactive</option></select>`,
    showCancelButton: true,
    preConfirm: () => ({
      department: document.getElementById("editDepartment").value,
      role: document.getElementById("editRole").value,
      status: document.getElementById("editStatus").value
    })
  });
  if (value) {
    user.department = value.department;
    user.role = value.role;
    user.status = value.status;
    await saveUsers(users);
    Swal.fire("Success", "User updated", "success");
    await writeAuditLog("User Management","Update User ("+username+")");
    viewUsers();
  }
}

async function deleteUser(username) {
  const result = await Swal.fire({
    title: `Delete user ${username}?`,
    icon: 'warning',
    showCancelButton: true,
    confirmButtonText: 'Yes, delete'
  });
  if (result.isConfirmed) {
    let users = await getUsers();
    users = users.filter(u => u.username !== username);
    await saveUsers(users);
    Swal.fire("Deleted!", "User deleted", "success");
    await writeAuditLog("User Management","Delete User ("+username+")");
    viewUsers();
  }
}

async function changeUserPassword(username) {
  let users = await getUsers();
  let user = users.find(u => u.username === username);
  if (!user) return;
  const { value: newPassword } = await Swal.fire({
    title: `Change Password for ${username}`,
    input: "password",
    inputLabel: "New Password",
    inputPlaceholder: "Enter new password",
    showCancelButton: true
  });
  if (newPassword) {
    user.password = newPassword;
    user.pwdDate = new Date().toISOString();
    await saveUsers(users);
    Swal.fire("Success", "Password changed successfully", "success");
    if (username === JSON.parse(localStorage.getItem("loginUser")).username) {
      localStorage.setItem("loginUser", JSON.stringify(user));
    }
  }
}

function formatDate(date){

let d=new Date(date);

let day=("0"+d.getDate()).slice(-2);

function calculateDays(dueDateStr, completedDateStr){

if(!dueDateStr) return "-";

let dueDate = new Date(dueDateStr);
let completedDate = completedDateStr ? new Date(completedDateStr) : new Date();

if(isNaN(dueDate) || isNaN(completedDate)) return "-";

let diffTime = completedDate - dueDate;
let diffDays = Math.floor(diffTime / (1000*60*60*24));

if(!completedDateStr){
if(diffDays > 0) return `<span style="color:red">Overdue ${diffDays} days</span>`;
if(diffDays === 0) return `<span style="color:orange">Due Today</span>`;
return `<span style="color:green">${Math.abs(diffDays)} days left</span>`;
}

if(diffDays > 0){
return `<span style="color:red">Late by ${diffDays} days</span>`;
}
else if(diffDays < 0){
return `<span style="color:green">Completed ${Math.abs(diffDays)} days early</span>`;
}
else{
return `<span style="color:blue">Completed On Time</span>`;
}

}

let rows="";

if(snapshot.exists()){

snapshot.forEach(child=>{

let log = child.val();

rows+=`
<tr>
<td>${log.username}</td>
<td>${log.functionName}</td>
<td>${log.activity}</td>
<td>${log.ipAddress}</td>
<td>${log.dateTime}</td>
</tr>
`;

});

}

contentArea.innerHTML=`

<div class="card">
<div class="card-body">

<h2>Audit Trail Logs</h2>

<table id="auditTable" class="table table-bordered table-striped w-100">

<thead class="table-dark">

<tr>
<th>User</th>
<th>Function</th>
<th>Activity</th>
<th>IP Address</th>
<th>Date & Time</th>
</tr>

<tr>
<th><input class="form-control form-control-sm"></th>
<th><input class="form-control form-control-sm"></th>
<th><input class="form-control form-control-sm"></th>
<th><input class="form-control form-control-sm"></th>
<th><input class="form-control form-control-sm"></th>
</tr>

</thead>

<tbody>
${rows || "<tr><td colspan='5'>No Logs</td></tr>"}
</tbody>

</table>

</div>
</div>
`;

setTimeout(()=>{

let table=$("#auditTable").DataTable({

pageLength:10,

lengthMenu:[[10,50,100,-1],[10,50,100,"All"]],

scrollY:"400px",

scrollCollapse:true,

paging:true,

fixedHeader:true,

dom:'Blfrtip',

buttons:[
'colvis',
{extend:'excel',title:'Audit_Logs'},
{extend:'csv',title:'Audit_Logs'},
{extend:'print'}
],

order:[[4,"desc"]]

});

table.columns().every(function(index){

$('input',table.table().header().rows[1].cells[index])
.on('keyup change',function(){

table.column(index)
.search(this.value)
.draw();

});

});

},300);

}
