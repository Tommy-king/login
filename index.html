<script type="module">

  const app = initializeApp(firebaseConfig);
  const db = getDatabase(app);

  window.ref = ref;
  window.set = set;
  window.get = get;
  window.child = child;
  window.update = update;
  window.remove = remove;

</script>

<script>
const AUTO_LOGOUT_MINUTES = 15;
const PASSWORD_EXPIRY_DAYS = 30;
let timer;
const contentArea = document.getElementById("contentArea");

function getLoggedUser(){
  return JSON.parse(localStorage.getItem("loginUser") || "{}");
}

function isAdmin(){
  let user = getLoggedUser();
  return user.role === "Admin";
}

// Auto logout timer reset
document.addEventListener("mousemove", resetTimer);
document.addEventListener("keypress", resetTimer);
function resetTimer(){
  clearTimeout(timer);
  timer = setTimeout(() => {
    Swal.fire("Session Timeout", "Auto logout", "info");
    logout();
  }, AUTO_LOGOUT_MINUTES * 60000);
}

// ----------- FIREBASE USER FUNCTIONS ------------

// Get users from Firebase Realtime Database
async function getUsers() {
  try {
    const dbRef = ref(db);
    const snapshot = await get(child(dbRef, "users"));
    if (snapshot.exists()) {
      return Object.values(snapshot.val());
    }
    return [];
  } catch (error) {
    console.error("Error getting users:", error);
    return [];
  }
}

// Save users array to Firebase Realtime Database
async function saveUsers(users) {
  try {
    let usersObj = {};
    users.forEach(u => {
      usersObj[u.username] = u;
    });
    await set(ref(db, "users"), usersObj);
  } catch (error) {
    console.error("Error saving users:", error);
  }
}

function updateUIAccess() {
  let loggedUser = JSON.parse(localStorage.getItem("loginUser") || "{}");
  let role = loggedUser.role || "";

  // Select all buttons in sidebar and ribbon that have data-role
  let buttons = document.querySelectorAll("[data-role]");

  buttons.forEach(btn => {
    let roles = btn.getAttribute("data-role").split(",").map(r => r.trim());
    if (roles.includes(role)) {
      btn.style.display = "inline-block"; // show
    } else {
      btn.style.display = "none"; // hide
    }
  });
}
// ----------- LOGIN / LOGOUT ------------

async function login() {
 if(!window.db){
Swal.fire("Error","Firebase not initialized yet. Please refresh.","error");
return;
}

let username = document.getElementById("loginUser").value.trim();
let password = document.getElementById("loginPass").value.trim();

  try {
    const snapshot = await get(ref(db, "users"));

    if (!snapshot.exists()) {
      Swal.fire("Error", "No users found in database", "error");
      return;
    }

    let users = snapshot.val();
    let foundUser = null;

    // Find the user
    Object.values(users).forEach(user => {
      if (user.username === username && user.password === password) {
        foundUser = user;
      }
    });

    if (!foundUser) {
      Swal.fire("Login Failed", "Invalid username or password", "error");
      return;
    }

    if (foundUser.status !== "Active") {
      Swal.fire("Access Denied", "User inactive", "error");
      return;
    }

    // Save logged-in user
    localStorage.setItem("loginUser", JSON.stringify(foundUser));

    // Show dashboard and hide login
    document.getElementById("loginPage").style.display = "none";
    document.getElementById("dashboard").style.display = "block";
    document.getElementById("displayUser").innerHTML = `${foundUser.username} (${foundUser.role})`;

    // Update UI access for buttons based on data-role
    updateUIAccess();
    listenNotifications();
    // Load home page
    home();

  } catch (error) {
    console.error(error);
    Swal.fire("Error", error.message, "error");
    console.error(error);
  }
}
function logout() {
  localStorage.removeItem("loginUser");
  document.getElementById("loginPage").style.display = "block";
  document.getElementById("dashboard").style.display = "none";
}

function home() {
  contentArea.innerHTML = `<div class="card mb-3"><div class="card-body"><h2>Dashboard</h2><p>Welcome to the Admin Dashboard</p></div></div>`;
}

// ----------- PASSWORD CHANGE ------------

async function changePassword() {
  let loggedUser = JSON.parse(localStorage.getItem("loginUser") || "{}");
  if (!loggedUser.username) return;

  const { value: newPassword } = await Swal.fire({
    title: "Change Password",
    input: "password",
    inputLabel: "New Password",
    inputPlaceholder: "Enter new password",
    showCancelButton: true
  });

  if (newPassword) {
    let users = await getUsers();
    let user = users.find(u => u.username === loggedUser.username);
    if (user) {
      user.password = newPassword;
      user.pwdDate = new Date().toISOString();
      await saveUsers(users);
      localStorage.setItem("loginUser", JSON.stringify(user));
      Swal.fire("Success", "Password changed successfully", "success");
    }
  }
}

// ----------- USER MANAGEMENT ------------

function createUserPage() {

if(!isAdmin()){
Swal.fire("Access Denied","Admin only feature","error");
return;
}

contentArea.innerHTML = `<div class="card mb-3"><div class="card-body">
<h2>Create User</h2>

<input id="newUsername" placeholder="Username"><br>
<input id="newUserID" placeholder="User ID"><br>
<input id="newDepartment" placeholder="Department"><br>
<input id="newPassword" type="password" placeholder="Password"><br>

<select id="newRole">
<option value="Admin">Admin</option>
<option value="User">User</option>
</select><br>

<select id="newStatus">
<option value="Active">Active</option>
<option value="Inactive">Inactive</option>
</select><br>

<button class="create-btn" onclick="createUser()">Create</button>

</div></div>`;
}

  
async function createUser() {
  let user = getLoggedUser();
if(user.role !== "Admin"){
Swal.fire("Access Denied","Admin only feature","error");
return;
}
  let username = document.getElementById("newUsername").value.trim();
  let userID = document.getElementById("newUserID").value.trim();
  let dept = document.getElementById("newDepartment").value.trim();
  let password = document.getElementById("newPassword").value.trim();
  let role = document.getElementById("newRole").value;
  let status = document.getElementById("newStatus").value;

  if (!username || !userID || !dept || !password)
    return Swal.fire("Error", "All fields are required", "error");

  let users = await getUsers();

  if (users.find(u => u.username === username || u.userID === userID))
    return Swal.fire("Error", "Username or User ID already exists", "error");

  users.push({ username, userID, department: dept, password, role, status, pwdDate: new Date().toISOString() });

  await saveUsers(users);
  Swal.fire("Success", "User created successfully", "success");
  createUserPage();
}



  
async function viewUsers() {

let user = getLoggedUser();

if(user.role !== "Admin"){
Swal.fire("Access Denied","Admin only feature","error");
return;
}

let users = await getUsers();

let rows = users.map(u => `<tr>
<td>${u.username}</td>
<td>${u.userID}</td>
<td>${u.department}</td>
<td>${u.role}</td>
<td>${u.status}</td>

<td>
<span class="action" onclick="editUser('${u.username}')"><i class="fa fa-edit"></i></span>
<span class="action" onclick="deleteUser('${u.username}')"><i class="fa fa-trash"></i></span>
<span class="action" onclick="changeUserPassword('${u.username}')"><i class="fa fa-key"></i></span>
</td>

</tr>`).join("");

contentArea.innerHTML = `<div class="card">

setTimeout(()=>{

$("#userTable").DataTable({
pageLength: 10,

scrollY: "400px",

}

async function editUser(username) {
  let users = await getUsers();
  let user = users.find(u => u.username === username);
  if (!user) return;
  const { value } = await Swal.fire({
    title: `Edit User: ${username}`,
    html: `<input id="editDepartment" value="${user.department}" class="swal2-input">
      <select id="editRole" class="swal2-input"><option value="Admin" ${user.role === 'Admin' ? 'selected' : ''}>Admin</option><option value="User" ${user.role === 'User' ? 'selected' : ''}>User</option></select>
      <select id="editStatus" class="swal2-input"><option value="Active" ${user.status === 'Active' ? 'selected' : ''}>Active</option><option value="Inactive" ${user.status === 'Inactive' ? 'selected' : ''}>Inactive</option></select>`,
    showCancelButton: true,
    preConfirm: () => ({
      department: document.getElementById("editDepartment").value,
      role: document.getElementById("editRole").value,
      status: document.getElementById("editStatus").value
    })
  });
  if (value) {
    user.department = value.department;
    user.role = value.role;
    user.status = value.status;
    await saveUsers(users);
    Swal.fire("Success", "User updated", "success");
    viewUsers();
  }
}

async function deleteUser(username) {
  const result = await Swal.fire({
    title: `Delete user ${username}?`,
    icon: 'warning',
    showCancelButton: true,
    confirmButtonText: 'Yes, delete'
  });
  if (result.isConfirmed) {
    let users = await getUsers();
    users = users.filter(u => u.username !== username);
    await saveUsers(users);
    Swal.fire("Deleted!", "User deleted", "success");
    viewUsers();
  }
}

async function changeUserPassword(username) {
  let users = await getUsers();
  let user = users.find(u => u.username === username);
  if (!user) return;
  const { value: newPassword } = await Swal.fire({
    title: `Change Password for ${username}`,
    input: "password",
    inputLabel: "New Password",
    inputPlaceholder: "Enter new password",
    showCancelButton: true
  });
  if (newPassword) {
    user.password = newPassword;
    user.pwdDate = new Date().toISOString();
    await saveUsers(users);
    Swal.fire("Success", "Password changed successfully", "success");
    if (username === JSON.parse(localStorage.getItem("loginUser")).username) {
      localStorage.setItem("loginUser", JSON.stringify(user));
    }
  }
}

// --------------------- EXCEL MODULE --------------------- //
function formatDate(value){ let d=new Date(value); if(isNaN(d)) return value; return ("0"+d.getDate()).slice(-2)+"-"+("0"+(d.getMonth()+1)).slice(-2)+"-"+d.getFullYear(); }

  function openExcelPage(){
    contentArea.innerHTML=`<div class="card"><div class="card-body">
        <h2>Excel Viewer</h2>
        <input type="file" id="excelFile" class="form-control mb-3">
        <ul class="nav nav-tabs mb-3" id="sheetTabs"></ul>
        <div class="tab-content" id="tabContent"></div>
    </div></div>`;

    document.getElementById('excelFile').addEventListener('change',function(e){
        let file=e.target.files[0]; if(!file) return;
        let reader=new FileReader();
        reader.onload=function(evt){
            let data=new Uint8Array(evt.target.result);
            let workbook=XLSX.read(data,{type:"array",cellDates:true});
            const sheetTabs=document.getElementById("sheetTabs");
            const tabContent=document.getElementById("tabContent");
            sheetTabs.innerHTML=""; tabContent.innerHTML="";
            workbook.SheetNames.forEach((name,index)=>{
                let active=index===0?"active":"";
                sheetTabs.innerHTML+=`<li class="nav-item"><button class="nav-link ${active}" data-bs-toggle="tab" data-bs-target="#tab${index}">${name}</button></li>`;
                let sheet=workbook.Sheets[name]; let json=XLSX.utils.sheet_to_json(sheet,{header:1,defval:"",blankrows:true});
                if(json.length===0) return;
                let headers=json[0]; let rows=json.slice(1);
                let table=`<table id="tbl${index}" class="table table-bordered table-hover table-striped w-100"><thead><tr>`;
                headers.forEach(h=>table+=`<th>${h||""}</th>`); table+="</tr><tr>";
                headers.forEach(()=>table+=`<th><input class="form-control form-control-sm" placeholder="Filter"></th>`); table+="</tr></thead><tbody>";
                rows.forEach((r,rowIndex)=>{ table+="<tr>"; for(let colIndex=0;colIndex<headers.length;colIndex++){ let val=r[colIndex]||""; let cell=XLSX.utils.encode_cell({r:rowIndex+1,c:colIndex}); let c=sheet[cell]; if(c && c.t==="d") val=formatDate(c.v); if(c && c.l && c.l.Target) table+=`<td><a href="${c.l.Target}" target="_blank">Link</a></td>`; else table+=`<td>${val}</td>`; } table+="</tr>"; });
                table+="</tbody></table>";
                let show=index===0?"show active":"";
                tabContent.innerHTML+=`<div class="tab-pane fade ${show}" id="tab${index}">${table}</div>`;
            });
            $("table").each(function(){
                if($.fn.DataTable.isDataTable(this)) $(this).DataTable().destroy();
                let table=$(this).DataTable({pageLength:10,orderCellsTop:true,lengthMenu:[[10,50,100,-1],[10,50,100,"All"]],scrollY:"400px",scrollCollapse:true,paging:true,fixedHeader:true,dom:'Blfrtip',buttons:['colvis','excel','csv','print']});
                $(this).closest('.dataTables_wrapper').find("thead tr:eq(1) th input").each(function(i){ $(this).on("keyup change",function(){ if(table.column(i).search()!==this.value) table.column(i).search(this.value).draw(); }); });
            });
        };
        reader.readAsArrayBuffer(file);
    });
    /*document.getElementById('excelFile').click();*/
}

// Calculator Functions
function appendCalc(val){
document.getElementById("calcDisplay").value += val;
}

function clearCalc(){
document.getElementById("calcDisplay").value = "";
}

function calculateCalc(){
let expr = document.getElementById("calcDisplay").value;

expr = expr.replace(/(\d+(\.\d+)?)%/g,"($1/100)");

try{
document.getElementById("calcDisplay").value = eval(expr);
}
catch{
alert("Invalid Expression");
}
}

  // Keyboard Support
document.addEventListener("keydown", function(e){

let display = document.getElementById("calcDisplay");
if(!display) return;

let key = e.key;

if(!isNaN(key) || key=="." || key=="+" || key=="-" || key=="*" || key=="/" || key=="%"){
display.value += key;
}

if(key=="Enter"){
calculateCalc();
}

if(key=="Backspace"){
display.value = display.value.slice(0,-1);
}

if(key=="Escape"){
display.value = "";
}

});

// CREATE TASK
async function addTask(){

let title=document.getElementById("taskTitle").value.trim();

if(!title){
Swal.fire("Validation","Task title required","warning");
return;
}

let priority=document.getElementById("taskPriority").value;

let due=document.getElementById("taskDate").value;

let loggedUser=getLoggedUser();

let assignedUser;

if(loggedUser.role==="Admin"){
assignedUser=document.getElementById("taskUser").value;
}else{
assignedUser=loggedUser.username;
}

let id=Date.now();

await set(ref(db,"tasks/"+id),{

id,
title,
priority,
due,
status:"Pending",
createdBy:loggedUser.username,
assignedTo:assignedUser,
comments:[]

});

Swal.fire("Success","Task created","success");

loadTasks();

}

  //Date Format dd-mm-yyyy
function formatDate(date){

if(!date) return "-";

let d=new Date(date);

let day=("0"+d.getDate()).slice(-2);
let month=("0"+(d.getMonth()+1)).slice(-2);
let year=d.getFullYear();

return `${day}-${month}-${year}`;

}

async function toggleTask(id){

let loggedUser=getLoggedUser();

const snap = await get(ref(db,"tasks/"+id));

let task = snap.val();

if(!task) return;

if(loggedUser.role!=="Admin" && task.assignedTo!==loggedUser.username){

Swal.fire("Access Denied","You can't change this task","error");

return;

}

let newStatus = task.status==="Pending" ? "Completed" : "Pending";

await update(ref(db,"tasks/"+id),{status:newStatus});

loadTasks();

}

  
async function editTask(id){

let loggedUser=getLoggedUser();

const snap=await get(ref(db,"tasks/"+id));

let task=snap.val();

if(loggedUser.role!=="Admin" && task.createdBy!==loggedUser.username){
Swal.fire("Only Admin or Creator can edit");
return;
}

let newTitle=prompt("Edit Task",task.title);

if(!newTitle) return;

await update(ref(db,"tasks/"+id),{title:newTitle});

loadTasks();

}

async function deleteTask(id){

let loggedUser=getLoggedUser();

const snap=await get(ref(db,"tasks/"+id));

let task=snap.val();

if(loggedUser.role!=="Admin" && task.createdBy!==loggedUser.username){

Swal.fire("Access Denied","You can delete only your task","error");

return;

}

await remove(ref(db,"tasks/"+id));

Swal.fire("Deleted","Task removed","success");

loadTasks();

}

async function taskComments(id){

let comment = await Swal.fire({
title:"Add Comment",
input:"text",
inputPlaceholder:"Enter comment...",
showCancelButton:true
});

if(!comment.value) return;

const snap = await get(ref(db,"tasks/"+id+"/comments"));

let comments = snap.exists() ? snap.val() : [];

comments.push({

user:getLoggedUser().username,
text:comment.value,
time:new Date().toLocaleString()

});

await set(ref(db,"tasks/"+id+"/comments"),comments);

Swal.fire({
icon:"success",
title:"Comment added"
});

/* refresh table */
loadTasks();

}

async function openKanban(){

<div id="pendingCol" class="kanban-column"></div>

snapshot.forEach(child=>{

let card = document.createElement("div");

card.className="kanban-card";

card.dataset.id=t.id;

card.innerHTML=`<b>${t.title}</b><br>${t.assignedTo}`;

if(t.status=="Pending")
document.getElementById("pendingCol").appendChild(card);

else
document.getElementById("doneCol").appendChild(card);

});

initDrag();

}


function initDrag(){

["pendingCol","doneCol"].forEach(col=>{

new Sortable(document.getElementById(col),{

group:"tasks",

animation:150,

onEnd: async function(evt){

let id = evt.item.dataset.id;

let status="Pending";

if(evt.to.id=="doneCol") status="Completed";

await update(ref(db,"tasks/"+id),{status});

}

});

});

}

//Due Date Range Filter
async function filterDate(){

let from=document.getElementById("fromDate").value;
let to=document.getElementById("toDate").value;

const snapshot=await get(ref(db,"tasks"));

let rows="";

snapshot.forEach(child=>{

let t=child.val();

if(!t.due) return;

if(t.due>=from && t.due<=to){

rows+=`<tr>
<td>${t.title}</td>
<td>${t.priority}</td>
<td>${formatDate(t.due)}</td>
<td>${t.status}</td>
<td>${t.assignedTo}</td>
</tr>`;

}

});

document.getElementById("taskTable").innerHTML=rows;

}

  //Search Task 

function searchTasks(){

let value=document.getElementById("taskSearch").value.toLowerCase();

$("#taskTable tr").filter(function(){

$(this).toggle(

$(this).text().toLowerCase().indexOf(value)>-1

);

});

}
  

//update to do status
async function updateStatus(id,status){

let updateData={status:status};

if(status==="Completed"){

let today=new Date().toLocaleDateString("en-GB");

updateData.completedDate=today;

}else{

updateData.completedDate="";

}

await update(ref(db,"tasks/"+id),updateData);

Swal.fire("Status updated");

loadTasks();

}

function statusColor(status){

if(status==="Pending") return "color:red;font-weight:bold";

if(status==="In-Progress") return "color:orange;font-weight:bold";

if(status==="Completed") return "color:green;font-weight:bold";

return "";

}

  // Automatic Role Control (paste here at the very end)
  (function() {
    const checkRoles = () => {
      const role = getLoggedUser().role;
      document.querySelectorAll("[data-role]").forEach(btn => {
        const roles = btn.getAttribute("data-role").split(",").map(r => r.trim());
        btn.style.display = roles.includes(role) ? "inline-block" : "none";
      });
    };

    // Run once on page load
    checkRoles();

    // Watch for dynamically added buttons
    const observer = new MutationObserver(checkRoles);
    observer.observe(document.body, { childList: true, subtree: true });
  })();
