<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Admin System</title>

<!-- CSS -->
<link rel="stylesheet" href="css/style.css">

<!-- Bootstrap -->
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<!-- Fontawesome -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

<!-- Datatable -->
<link href="https://cdn.datatables.net/1.13.6/css/jquery.dataTables.min.css" rel="stylesheet"/>

</head>

<body>

<!-- LOGIN PAGE -->
<div id="loginPage">

<h2>User Login</h2>

<input id="loginUser" placeholder="Username">

<input id="loginPass" type="password" placeholder="Password">

<button onclick="login()">Login</button>

</div>


<!-- DASHBOARD -->
<div id="dashboard">

<div class="topbar">

<div class="logo">
<i class="fa fa-chart-line"></i>
Admin System
</div>

<div class="user-area">

<i class="fa fa-bell" onclick="toggleNotifications()"></i>

<span id="displayUser"></span>

<button onclick="logout()">Logout</button>

</div>

</div>

<div class="sidebar">

<button onclick="home()">Dashboard</button>

<button onclick="createUserPage()" data-role="Admin">
Create User
</button>

<button onclick="viewUsers()" data-role="Admin">
User Management
</button>

<button onclick="openTodoPage()">
Task Manager
</button>

<button onclick="openExcelPage()">
Excel Viewer
</button>

</div>

<div class="content" id="contentArea"></div>

</div>


<!-- LIBRARIES -->

<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

<script src="https://cdn.datatables.net/1.13.6/js/jquery.dataTables.min.js"></script>

<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>


<!-- FIREBASE -->
<script type="module" src="firebase/firebase-config.js"></script>

<!-- JS MODULES -->
<script src="js/auth.js"></script>
<script src="js/users.js"></script>
<script src="js/tasks.js"></script>
<script src="js/excel.js"></script>
<script src="js/datatable.js"></script>
<script src="js/notifications.js"></script>
<script src="js/app.js"></script>

</body>
</html>
